<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-label="FBSF campus illustration">
  <defs>
    <linearGradient id="g-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf0f7"/>
      <stop offset="1" stop-color="#dce6f2"/>
    </linearGradient>
    <linearGradient id="g-bld" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4d7c"/>
      <stop offset="1" stop-color="#1c3559"/>
    </linearGradient>
    <linearGradient id="g-bld2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a5d94"/>
      <stop offset="1" stop-color="#27456f"/>
    </linearGradient>
  </defs>
  <rect width="720" height="480" rx="16" fill="url(#g-sky)"/>
  <circle cx="560" cy="90" r="60" fill="#3db166" fill-opacity="0.12"/>
  <circle cx="560" cy="90" r="40" fill="#3db166" fill-opacity="0.16"/>
  <!-- main building -->
  <g>
    <rect x="160" y="200" width="400" height="220" rx="10" fill="url(#g-bld)"/>
    <polygon points="140,200 360,110 580,200" fill="#16294a"/>
    <rect x="330" y="120" width="60" height="100" fill="#16294a"/>
    <circle cx="360" cy="160" r="12" fill="#3db166"/>
    <rect x="348" y="140" width="24" height="20" rx="4" fill="#3db166" fill-opacity="0.5"/>
    <!-- windows -->
    <g fill="#b8cde8" fill-opacity="0.85">
      <rect x="190" y="230" width="40" height="50" rx="4"/><rect x="250" y="230" width="40" height="50" rx="4"/>
      <rect x="430" y="230" width="40" height="50" rx="4"/><rect x="490" y="230" width="40" height="50" rx="4"/>
      <rect x="190" y="310" width="40" height="50" rx="4"/><rect x="250" y="310" width="40" height="50" rx="4"/>
      <rect x="430" y="310" width="40" height="50" rx="4"/><rect x="490" y="310" width="40" height="50" rx="4"/>
      <rect x="330" y="310" width="60" height="110" rx="6" fill="#3db166" fill-opacity="0.25"/>
    </g>
    <!-- entrance -->
    <rect x="310" y="370" width="100" height="50" rx="6" fill="#0f1e38"/>
    <rect x="320" y="380" width="36" height="40" rx="4" fill="#3db166" fill-opacity="0.3"/>
    <rect x="364" y="380" width="36" height="40" rx="4" fill="#3db166" fill-opacity="0.3"/>
  </g>
  <!-- side wing -->
  <rect x="90" y="280" width="90" height="140" rx="8" fill="url(#g-bld2)"/>
  <g fill="#b8cde8" fill-opacity="0.7">
    <rect x="110" y="300" width="26" height="30" rx="3"/><rect x="146" y="300" width="26" height="30" rx="3"/>
    <rect x="110" y="348" width="26" height="30" rx="3"/><rect x="146" y="348" width="26" height="30" rx="3"/>
  </g>
  <!-- trees -->
  <g>
    <circle cx="70" cy="250" r="42" fill="#3db166" fill-opacity="0.55"/>
    <circle cx="50" cy="280" r="34" fill="#3db166" fill-opacity="0.45"/>
    <rect x="64" y="310" width="12" height="40" fill="#6b4a2a"/>
    <circle cx="640" cy="250" r="46" fill="#3db166" fill-opacity="0.55"/>
    <circle cx="660" cy="285" r="36" fill="#3db166" fill-opacity="0.45"/>
    <rect x="636" y="318" width="12" height="42" fill="#6b4a2a"/>
    <circle cx="600" cy="300" r="30" fill="#3db166" fill-opacity="0.4"/>
    <rect x="595" y="330" width="10" height="34" fill="#6b4a2a"/>
  </g>
  <!-- ground -->
  <rect x="0" y="400" width="720" height="80" fill="#c9d8e8"/>
  <rect x="0" y="400" width="720" height="6" fill="#3db166" fill-opacity="0.5"/>
  <!-- path -->
  <path d="M360 480 L360 408 Q360 380 340 374" stroke="#e8eef6" stroke-width="14" fill="none" stroke-linecap="round"/>
</svg>
