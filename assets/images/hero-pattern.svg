<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16294a"/>
      <stop offset="0.65" stop-color="#192f59"/>
      <stop offset="1" stop-color="#1f3d6e"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3db166" stop-opacity="0.0"/>
      <stop offset="1" stop-color="#3db166" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="720" fill="url(#sky)"/>
  <rect width="1440" height="720" fill="url(#grid)"/>
  <circle cx="1180" cy="140" r="320" fill="#3db166" fill-opacity="0.06"/>
  <circle cx="1180" cy="140" r="220" fill="#3db166" fill-opacity="0.08"/>
  <rect x="-100" y="420" width="1640" height="300" fill="url(#glow)"/>
  <!-- Campus silhouette -->
  <g fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2">
    <path d="M0 560h150v-90l30-22 30 22v90z"/>
    <path d="M120 560h70v-110l40-30 40 30v110z"/>
    <path d="M220 560h120v-80l30-20 30 20v80z"/>
