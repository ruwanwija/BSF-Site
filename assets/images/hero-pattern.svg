    <path d="M380 560h90v-220l20-30 20 30v220z"/>
    <circle cx="440" cy="420" r="16" fill="#3db166" fill-opacity="0.35" stroke="none"/>
    <path d="M500 560h100v-120l35-26 35 26v120z"/>
    <path d="M620 560h130v-90l30-20 30 20v90z"/>
    <path d="M780 560h80v-150l40-30 40 30v150z"/>
    <path d="M880 560h120v-90l30-20 30 20v90z"/>
    <path d="M1030 560h90v-130l35-24 35 24v130z"/>
    <path d="M1160 560h120v-90l30-20 30 20v90z"/>
    <path d="M1310 560h130v-110l40-30 40 30v110z"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.10">
    <rect x="0" y="560" width="1440" height="160"/>
  </g>
  <!-- subtle diagonal accent -->
  <path d="M-200 640L1640 440" stroke="#3db166" stroke-opacity="0.18" stroke-width="3"/>
  <path d="M-200 680L1640 480" stroke="#3db166" stroke-opacity="0.10" stroke-width="2"/>
